name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run smoke tests
        run: |
          python tests/run_tests.py
      - name: Verify core imports
        run: |
          python tests/ci/verify_core_imports.py

  full-validation:
    name: full correctness (ubuntu / py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run full correctness suite
        run: |
          python tests/test_pub_correctness.py

  extensions:
    name: compiled backends (${{ matrix.os }} / py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install cython
      - name: Build C extension
        run: |
          python rdt_spatial_index/c_ext/setup.py build_ext --inplace
      - name: Build Cython extension
        run: |
          python rdt_spatial_index/setup_cython.py build_ext --inplace
      - name: Verify compiled wrappers
        run: |
          python tests/ci/verify_compiled_wrappers.py

  benchmark-smoke:
    name: benchmark smoke (ubuntu / py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]"
      - name: Run quick benchmark
        run: |
          python benchmarks/compare_indexes.py --n 5000
      - name: Run publication benchmark smoke
        run: |
          python benchmarks/pub_benchmark.py --fast --n50k-only
      - name: Generate figures/tables
        run: |
          python benchmarks/generate_figures.py
